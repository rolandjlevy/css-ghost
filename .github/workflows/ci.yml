name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**", "chore/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm test

      - name: Verify CLI entrypoint
        run: node bin/css-ghost.js --help || true

      - name: Verify programmatic API exports
        run: |
          node --input-type=module <<'EOF'
          import { scan, generateReport } from './src/index.js';
          if (typeof scan !== 'function') throw new Error('scan must be a function');
          if (typeof generateReport !== 'function') throw new Error('generateReport must be a function');
          console.log('✅ Programmatic API exports verified');
          EOF
